/* 한 화면 지도 앱: 위는 검색/안내 띠, 아래는 경로 시트, 오른쪽은 떠 있는 버튼 */
:root {
  --navy: #0f3c73;      /* 남색 띠 */
  --blue: #1f62b0;      /* 주 버튼 */
  --sky: #4d8fd6;       /* 보조 */
  --mist: #dbe7f5;      /* 옅은 강조 */
  --bg: #eef1f5;        /* 카드 바탕 */
  --card: #ffffff;
  --ink: #18222f;
  --sub: #5c6b7e;
  --line: #d5dde8;
  --route: #1f62b0;
  --go: #12805c;
  --warn: #c2410c;
  --shadow: 0 8px 24px rgba(15,60,115,.18), 0 1px 3px rgba(15,60,115,.12);
  --font: 'Paperlogy', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1a2230; --card:#232d3d; --ink:#e8eef6; --sub:#9fb0c6; --line:#34425a; --mist:#2a3a55; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; height:100%; overflow:hidden; font-family:var(--font); color:var(--ink); background:var(--bg); }
#map { position:fixed; inset:0; background:#dfe6ee; }
button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
button:focus-visible, input:focus-visible { outline:3px solid var(--sky); outline-offset:2px; }
[hidden] { display:none !important; }

/* ── 검색 ─────────────────────────── */
#top { position:fixed; z-index:1000; top:calc(var(--st) + 10px); left:calc(var(--sl) + 10px); right:calc(var(--sr) + 10px); display:flex; flex-direction:column; gap:8px; }
.search { display:flex; align-items:center; gap:6px; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:6px 6px 6px 14px; }
.search svg { flex:none; width:20px; height:20px; stroke:var(--sub); }
.search input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:16px; color:var(--ink); padding:8px 2px; }
.search .clear { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; color:var(--sub); }
.modes { display:flex; gap:6px; }
.modes button { flex:1; padding:9px 0; border-radius:12px; background:var(--card); box-shadow:var(--shadow); font-size:14px; font-weight:600; color:var(--sub); display:flex; align-items:center; justify-content:center; gap:6px; }
.modes button svg { width:18px; height:18px; }
.modes button[aria-pressed="true"] { background:var(--navy); color:#fff; }
#results { background:var(--card); border-radius:16px; box-shadow:var(--shadow); max-height:52vh; overflow:auto; }
#results .item { display:block; width:100%; text-align:left; padding:12px 16px; border-bottom:1px solid var(--line); }
#results .item:last-child { border-bottom:0; }
#results .t { font-weight:700; font-size:15px; }
#results .a { font-size:13px; color:var(--sub); margin-top:2px; }
#results .d { float:right; font-size:12px; color:var(--blue); font-weight:600; font-variant-numeric:tabular-nums; margin-left:8px; }
#results .empty { padding:14px 16px; color:var(--sub); font-size:14px; }

/* ── 안내 띠 ─────────────────────── */
#banner { position:fixed; z-index:1000; top:0; left:0; right:0; padding:calc(var(--st) + 12px) calc(var(--sr) + 14px) 14px calc(var(--sl) + 14px); background:var(--navy); color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.25); display:flex; gap:14px; align-items:center; }
#banner .ico { flex:none; width:64px; height:64px; border-radius:16px; background:rgba(255,255,255,.12); display:grid; place-items:center; }
#banner .ico svg { width:44px; height:44px; stroke:#fff; }
#banner .txt { min-width:0; flex:1; }
#bDist { font-size:30px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; line-height:1.1; }
#bText { font-size:17px; font-weight:600; margin-top:2px; line-height:1.35; text-wrap:balance; }
#bNext { font-size:13px; opacity:.75; margin-top:4px; }
#offroute { position:fixed; z-index:1001; left:50%; transform:translateX(-50%); top:calc(var(--st) + 112px); background:var(--warn); color:#fff; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:var(--shadow); white-space:nowrap; }

/* ── 아래 시트 ───────────────────── */
.sheet { position:fixed; z-index:1000; left:0; right:0; bottom:0; background:var(--card); border-radius:20px 20px 0 0; box-shadow:0 -6px 24px rgba(15,60,115,.18); padding:16px calc(var(--sr) + 16px) calc(var(--sb) + 14px) calc(var(--sl) + 16px); }
.sheet h2 { margin:0; font-size:18px; line-height:1.3; text-wrap:balance; }
.sheet .addr { font-size:13px; color:var(--sub); margin-top:2px; }
.stats { display:flex; gap:18px; margin:14px 0; align-items:baseline; }
.stats div { display:flex; flex-direction:column; }
.stats b { font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:-.3px; }
.stats span { white-space:nowrap; font-size:12px; color:var(--sub); letter-spacing:.02em; }
.stats .big b { font-size:26px; color:var(--go); }
.row { display:flex; gap:8px; }
.btn { flex:1; padding:14px 0; border-radius:14px; font-weight:700; font-size:16px; background:var(--bg); color:var(--ink); }
.btn.primary { background:var(--blue); color:#fff; flex:2; }
.btn.stop { background:#b91c1c; color:#fff; flex:none; padding:14px 20px; }
#navbar .stats { margin:0; flex:1; min-width:0; justify-content:space-around; gap:10px; }
#navbar .stats b { font-size:19px; }
#navbar { display:flex; align-items:center; gap:10px; padding-top:12px; }

/* ── 떠 있는 버튼 ─────────────────── */
#fabs { position:fixed; z-index:999; right:calc(var(--sr) + 12px); display:flex; flex-direction:column; gap:10px; transition:bottom .2s; }
.fab { width:48px; height:48px; border-radius:14px; background:var(--card); box-shadow:var(--shadow); display:grid; place-items:center; }
.fab svg { width:24px; height:24px; stroke:var(--ink); }
.fab.on { background:var(--navy); }
.fab.on svg { stroke:#fff; }
#headBtn svg { color:var(--ink); }
#headBtn.on svg { color:#fff; }
#headBtn .lbl { position:absolute; font-size:9px; font-weight:800; bottom:3px; }
.fab { position:relative; }
#layerMenu { position:absolute; right:58px; bottom:0; background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; min-width:110px; }
#layerMenu button { padding:11px 14px; text-align:left; font-size:14px; border-bottom:1px solid var(--line); }
#layerMenu button:last-child { border-bottom:0; }
#layerMenu button[aria-pressed="true"] { color:var(--blue); font-weight:700; }

#toast { position:fixed; z-index:1100; left:50%; transform:translateX(-50%); bottom:calc(var(--sb) + 24px); background:rgba(24,34,47,.92); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; max-width:calc(100% - 32px); text-align:center; line-height:1.45; pointer-events:none; transition:opacity .3s; }
#gpsNote { position:fixed; z-index:998; left:calc(var(--sl) + 10px); right:calc(var(--sr) + 70px); background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:10px 14px; font-size:13px; line-height:1.5; color:var(--sub); }
#gpsNote b { color:var(--ink); }

/* 지도 위 표시 */
.me { width:52px; height:52px; position:relative; filter:drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
.me svg { position:absolute; inset:0; }
.dest-pin svg { width:34px; height:42px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.leaflet-popup-content { font-family:var(--font); font-size:14px; margin:12px 14px; }
.leaflet-popup-content button { display:block; width:100%; margin-top:6px; padding:9px 12px; border-radius:10px; background:var(--blue); color:#fff; font-weight:700; }
.leaflet-popup-content button.alt { background:#e5ebf3; color:#18222f; }
.leaflet-control-attribution { font-size:10px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="map"></div>

<!-- 검색 -->
<div id="top">
  <form class="search" id="searchForm" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" enterkeyhint="search" placeholder="목적지 검색 (장소·주소)" aria-label="목적지 검색">
    <button type="button" class="clear" id="clearBtn" aria-label="지우기" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </form>
  <div class="modes" role="group" aria-label="이동 수단">
    <button data-mode="pedestrian" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M8 12l3-4 3 2 3 1M11 8l-1 5"/></svg>도보</button>
    <button data-mode="bicycle" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8l4 8M14 5h2"/></svg>자전거</button>
    <button data-mode="auto" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-4l2-5h12l2 5v4z"/><circle cx="8" cy="16.5" r="1.6"/><circle cx="16" cy="16.5" r="1.6"/><path d="M4 12h16"/></svg>자동차</button>
  </div>
  <div id="results" hidden></div>
</div>

<div id="gpsNote" hidden></div>

<!-- 안내 띠 -->
<div id="banner" hidden>
  <div class="ico" id="bIco"></div>
  <div class="txt">
    <div id="bDist">-</div>
    <div id="bText">-</div>
    <div id="bNext"></div>
  </div>
</div>
<div id="offroute" hidden>경로를 벗어났습니다 · 다시 찾는 중</div>

<!-- 떠 있는 버튼 -->
<div id="fabs">
  <div style="position:relative">
    <button class="fab" id="layerBtn" aria-label="지도 종류"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <div id="layerMenu" hidden>
      <button data-layer="Base" aria-pressed="true">일반지도</button>
      <button data-layer="Satellite" aria-pressed="false">위성지도</button>
      <button data-layer="midnight" aria-pressed="false">야간지도</button>
      <button data-layer="white" aria-pressed="false">흰색지도</button>
    </div>
  </div>
  <button class="fab" id="fsBtn" aria-label="전체 화면" hidden></button>
  <button class="fab" id="voiceBtn" aria-label="음성 안내"></button>
  <button class="fab on" id="headBtn" aria-label="진행 방향을 위로"><svg viewBox="0 0 24 24" id="headIco" style="transition:transform .3s"><path d="M12 3l4 9h-8z" fill="#e5484d" stroke="none"/><path d="M12 21l-4-9h8z" fill="currentColor" stroke="none" opacity=".55"/></svg></button>
  <button class="fab" id="locBtn" aria-label="내 위치"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<!-- 경로 미리보기 -->
<div class="sheet" id="preview" hidden>
  <h2 id="pName">-</h2>
  <div class="addr" id="pAddr"></div>
  <div class="stats">
    <div class="big"><b id="pTime">-</b><span>소요 시간</span></div>
    <div><b id="pDist">-</b><span>거리</span></div>
    <div><b id="pEta">-</b><span>도착 예정</span></div>
  </div>
  <div class="row">
    <button class="btn" id="cancelBtn">취소</button>
    <button class="btn" id="simBtn">모의 주행</button>
    <button class="btn primary" id="startBtn">안내 시작</button>
  </div>
</div>

<!-- 안내 중 -->
<div class="sheet" id="navbar" hidden>
  <div class="stats">
    <div><b id="nTime">-</b><span>남은 시간</span></div>
    <div><b id="nDist">-</b><span>남은 거리</span></div>
    <div><b id="nEta">-</b><span>도착 예정</span></div>
  </div>
  <button class="btn stop" id="stopBtn">종료</button>
</div>

<div id="toast" style="opacity:0"></div>

<script>
'use strict';
// ── 설정 ──────────────────────────────────────────
const VWORLD_KEY = '348AFADA-F76F-4783-91E0-1C3F4AFFEAA1';
const ROUTER = 'https://valhalla1.openstreetmap.de/route';   // OpenStreetMap 경로 계산(무료 공개 서버)
const START_VIEW = [35.9297, 128.5442];                      // 위치를 받기 전: 대구과학대학교
const MODE = {
  pedestrian: { label:'도보',   offRoute:30, speak:[60, 15],        sim:6 },
  bicycle:    { label:'자전거', offRoute:40, speak:[150, 30],       sim:9 },
  auto:       { label:'자동차', offRoute:50, speak:[700, 250, 40],  sim:18 },
};

// ── 지도 ──────────────────────────────────────────
const map = L.map('map', { zoomControl:false, attributionControl:true, rotate:true, rotateControl:false, maxZoom:21, touchZoom:'center', doubleClickZoom:'center', scrollWheelZoom:'center', touchRotate:false, shiftKeyRotate:false, bearing:0 }).setView(START_VIEW, 16);
map.attributionControl.setPrefix(false).addAttribution('지도 © 브이월드 · 경로 © OpenStreetMap, Valhalla');
const vw = (layer) => L.tileLayer(
  `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${layer === 'Satellite' ? 'jpeg' : 'png'}`,
  { minZoom:6, maxZoom:21, maxNativeZoom:19 });
const layers = {
  Base: vw('Base'),
  Satellite: L.layerGroup([vw('Satellite'), vw('Hybrid')]),
  midnight: vw('midnight'),
  white: vw('white'),
};
let curLayer = layers.Base.addTo(map);
L.control.scale({ imperial:false, position:'bottomleft' }).addTo(map);

// ── 상태 ──────────────────────────────────────────
const S = {
  mode: 'pedestrian',
  me: null,            // {lat,lng,acc,heading}
  gps: 'wait',         // wait | ok | denied | none
  manualStart: false,  // GPS 대신 지도에서 출발지를 찍음
  dest: null,          // {lat,lng,name,addr}
  route: null,         // {pts, cum, total, time, mans}
  nav: false, sim: null, follow: true,
  idx: 0, along: 0, offCount: 0, lastReroute: 0, rerouting: false,
  spoken: new Set(), voice: true, wake: null,
  headUp: true, viewBearing: 0, compass: null, compassAt: 0, gpsCourse: null,
};
let meMarker = null, accCircle = null, destMarker = null, routeLine = null, routeCasing = null, doneLine = null;

const $ = (id) => document.getElementById(id);
const toastEl = $('toast'); let toastT;
function toast(msg, ms = 2600) { toastEl.textContent = msg; toastEl.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => toastEl.style.opacity = 0, ms); }

// ── 표시 형식 ─────────────────────────────────────
const fmtDist = (m) => m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + 'km' : Math.max(0, Math.round(m / 10) * 10) + 'm';
const fmtTime = (s) => { const m = Math.round(s / 60); return m < 60 ? Math.max(1, m) + '분' : Math.floor(m / 60) + '시간 ' + (m % 60) + '분'; };
const fmtEta = (s) => new Date(Date.now() + s * 1000).toLocaleTimeString('ko-KR', { hour:'numeric', minute:'2-digit' });
const speakDist = (m) => m >= 1000 ? (m / 1000).toFixed(1).replace('.0', '') + '킬로미터' : Math.round(m / 10) * 10 + '미터';

// ── 아이콘 ────────────────────────────────────────
const SVG = (inner, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${inner}</svg>`;
const ICON = {
  straight: '<path d="M12 21V5"/><path d="M6 11l6-6 6 6"/>',
  right:    '<path d="M7 21v-8a4 4 0 0 1 4-4h9"/><path d="M15 4l5 5-5 5"/>',
  slight:   '<path d="M9 21v-6L17 7"/><path d="M10.5 7H17v6.5"/>',
  sharp:    '<path d="M8 3v10l9 7"/><path d="M11 20.5h6.5V14"/>',
  uturn:    '<path d="M8 21V9a4 4 0 0 1 8 0v6"/><path d="M12 12l4 4 4-4"/>',
  round:    '<circle cx="12" cy="10" r="4"/><path d="M12 21v-7M15 7l4-4M15 3h4v4"/>',
  arrive:   '<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  merge:    '<path d="M12 21v-8L6 5M12 13l6-8"/><path d="M15 5h3v3"/>',
};
// Valhalla 회전 종류 → 아이콘(왼쪽은 좌우 반전)
function maneuverIcon(type) {
  const L = 'style="transform:scaleX(-1)"';
  const map = {
    9:['slight'], 10:['right'], 11:['sharp'], 12:['uturn', L], 13:['uturn'],
    14:['sharp', L], 15:['right', L], 16:['slight', L],
    18:['slight'], 19:['slight', L], 20:['slight'], 21:['slight', L],
    23:['slight'], 24:['slight', L], 25:['merge'], 26:['round'], 27:['round'],
    4:['arrive'], 5:['arrive'], 6:['arrive'],
  };
  const [k, ex] = map[type] || ['straight'];
  return SVG(ICON[k], ex || '');
}
const VOICE_ON = SVG('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>');
const VOICE_OFF = SVG('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>');

const MODE_GLYPH = {
  pedestrian: '<circle cx="13" cy="4.5" r="1.9" fill="#fff" stroke="none"/><path d="M10.5 20.5l2-5.5 2.7 2.6v2.9M8.5 12l3-3.6 2.8 1.8 2.7 1M11.5 8.4l-1.2 5"/>',
  bicycle: '<circle cx="6.5" cy="15.5" r="3.6"/><circle cx="17.5" cy="15.5" r="3.6"/><path d="M6.5 15.5l3.6-7h4.6l2.8 7M10.1 8.5l3.8 7M13.6 5.5h2"/>',
  auto: '<path d="M4.5 16v-3.6l2-4.6h11l2 4.6V16z"/><circle cx="8.3" cy="16.4" r="1.5" fill="#fff"/><circle cx="15.7" cy="16.4" r="1.5" fill="#fff"/><path d="M4.5 12.4h15"/>',
};
const meIcon = () => L.divIcon({ className:'', iconSize:[52,52], iconAnchor:[26,26],
  html:`<div class="me"><svg viewBox="0 0 52 52" width="52" height="52">
    <g id="meCone" style="transform-origin:26px 26px; transition:transform .4s"><path d="M26 1.5l8.5 11h-17z" fill="#1f62b0" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></g>
    <circle cx="26" cy="26" r="15.5" fill="#1f62b0" stroke="#fff" stroke-width="3.5"/>
    <g transform="translate(15 15) scale(.92)" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${MODE_GLYPH[S.mode]}</g>
  </svg></div>` });
const destIcon = L.divIcon({ className:'dest-pin', iconSize:[34,42], iconAnchor:[17,41],
  html:'<svg viewBox="0 0 34 42"><path d="M17 41S3 26 3 16a14 14 0 0 1 28 0c0 10-14 25-14 25z" fill="#c2410c" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5" fill="#fff"/></svg>' });

// ── 내 위치 ──────────────────────────────────────
function setMe(lat, lng, acc = 10, heading = null) {
  const prev = S.me;
  if (heading == null && prev) {
    const d = map.distance([prev.lat, prev.lng], [lat, lng]);
    heading = d > 2 ? bearing(prev.lat, prev.lng, lat, lng) : prev.heading;
  }
  S.me = { lat, lng, acc, heading };
  if (!meMarker) {
    meMarker = L.marker([lat, lng], { icon: meIcon(), zIndexOffset: 1000, interactive:false }).addTo(map);
    accCircle = L.circle([lat, lng], { radius: acc, color:'#1f62b0', weight:1, opacity:.4, fillOpacity:.08, interactive:false }).addTo(map);
  } else {
    meMarker.setLatLng([lat, lng]); accCircle.setLatLng([lat, lng]).setRadius(acc);
  }
  paintArrow();
  if (S.nav) onNavTick();
  followView();
}

function onGps(pos) {
  if (S.sim) return;
  const c = pos.coords;
  const first = S.gps !== 'ok';
  S.gps = 'ok'; S.manualStart = false; updateGpsNote();
  // 빠르게 움직이면 GPS 진행 방향, 천천히 걸을 때는 나침반, 둘 다 없으면 이동 궤적으로 계산
  S.gpsCourse = (c.heading != null && !isNaN(c.heading) && c.speed >= 1.8) ? c.heading : null;
  const h = S.gpsCourse ?? (Date.now() - S.compassAt < 3000 ? S.compass : null);
  if (first && !S.dest) map.setView([c.latitude, c.longitude], 17, { animate:false });
  setMe(c.latitude, c.longitude, c.accuracy, h);
}
function onGpsErr(err) {
  if (S.gps === 'ok') return;
  S.gps = err.code === 1 ? 'denied' : 'none';
  updateGpsNote();
}
function updateGpsNote() {
  const n = $('gpsNote');
  if (S.gps === 'ok' || S.manualStart || S.nav) { n.hidden = true; return; }
  const why = location.protocol !== 'https:' && !['localhost','127.0.0.1'].includes(location.hostname)
    ? '위치 기능은 <b>https://</b> 주소에서만 켜집니다.'
    : S.gps === 'denied' ? '<b>위치 권한이 꺼져 있습니다.</b> 브라우저 설정에서 이 사이트의 위치를 허용해 주세요.'
    : S.gps === 'none' ? '<b>위치를 찾지 못했습니다.</b> GPS를 켜고 하늘이 보이는 곳에서 다시 시도해 보세요.'
    : '<b>현재 위치를 찾는 중…</b>';
  n.innerHTML = why + (S.gps === 'wait' ? '' : '<br>지도를 <b>길게 누르면</b> 그곳을 출발지로 정할 수 있습니다.');
  n.hidden = false; layoutFloating();
}

if ('geolocation' in navigator) {
  navigator.geolocation.watchPosition(onGps, onGpsErr, { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
  setTimeout(updateGpsNote, 1500);
} else { S.gps = 'none'; updateGpsNote(); }

// ── 검색 (브이월드 검색 API, JSONP) ────────────────
let jsonpSeq = 0;
function jsonp(url, ms = 8000) {
  return new Promise((resolve, reject) => {
    const cb = '__vw' + (++jsonpSeq);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error('timeout')); }, ms);
    window[cb] = (d) => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
async function vwSearch(query, type, category) {
  let url = 'https://api.vworld.kr/req/search?service=search&request=search&version=2.0&crs=EPSG:4326&size=10&page=1&format=json&errorformat=json'
    + `&type=${type}&query=${encodeURIComponent(query)}&key=${VWORLD_KEY}`;
  if (category) url += '&category=' + category;
  if (S.me) { // 현재 위치 둘레 약 30km 안을 먼저
    const d = 0.3; url += `&bbox=${S.me.lng - d},${S.me.lat - d},${S.me.lng + d},${S.me.lat + d}`;
  }
  try {
    const r = (await jsonp(url)).response;
    if (r.status !== 'OK') return [];
    return r.result.items.map((it) => ({
      lat: +it.point.y, lng: +it.point.x,
      name: type === 'place' ? it.title : (it.address.road || it.address.parcel),
      addr: type === 'place' ? (it.address.road || it.address.parcel) : (it.address.parcel || ''),
      cat: it.category || '',
    }));
  } catch { return []; }
}
async function doSearch(query) {
  const box = $('results');
  box.innerHTML = '<div class="empty">찾는 중…</div>'; box.hidden = false;
  let [place, road, parcel] = await Promise.all([
    vwSearch(query, 'place'), vwSearch(query, 'address', 'road'), vwSearch(query, 'address', 'parcel')]);
  let list = [...place, ...road, ...parcel];
  if (!list.length && S.me) { // 근처에서 못 찾으면 전국에서
    const saved = S.me; S.me = null;
    [place, road] = await Promise.all([vwSearch(query, 'place'), vwSearch(query, 'address', 'road')]);
    S.me = saved; list = [...place, ...road];
  }
  if (S.me) list.forEach((x) => x.dist = map.distance([S.me.lat, S.me.lng], [x.lat, x.lng]));
  if (S.me) list.sort((a, b) => a.dist - b.dist);
  box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="empty">검색 결과가 없습니다. 장소 이름이나 도로명 주소로 다시 찾아보세요.</div>'; return; }
  for (const x of list.slice(0, 15)) {
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = (x.dist != null ? `<span class="d">${fmtDist(x.dist)}</span>` : '') + '<div class="t"></div><div class="a"></div>';
    b.querySelector('.t').textContent = x.name;
    b.querySelector('.a').textContent = x.addr;
    b.onclick = () => { box.hidden = true; $('q').blur(); setDest(x); };
    box.appendChild(b);
  }
}
$('searchForm').addEventListener('submit', (e) => { e.preventDefault(); const q = $('q').value.trim(); if (q) doSearch(q); });
$('q').addEventListener('input', () => { $('clearBtn').hidden = !$('q').value; if (!$('q').value) $('results').hidden = true; });
$('clearBtn').onclick = () => { $('q').value = ''; $('clearBtn').hidden = true; $('results').hidden = true; $('q').focus(); };

// ── 주소 (브이월드 주소 API) ───────────────────────
async function reverse(lat, lng) {
  try {
    const r = (await jsonp(`https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0&crs=epsg:4326&point=${lng},${lat}&format=json&type=both&key=${VWORLD_KEY}`)).response;
    if (r.status !== 'OK') return '';
    const road = r.result.find((x) => x.type === 'road'), parcel = r.result.find((x) => x.type === 'parcel');
    return (road || parcel).text;
  } catch { return ''; }
}

// ── 지도 길게 누르기 ─────────────────────────────
map.on('contextmenu', async (e) => {

// ── 목적지 · 경로 ───────────────────────────────
function setDest(x) {
  S.dest = x;
  if (destMarker) destMarker.setLatLng([x.lat, x.lng]); else destMarker = L.marker([x.lat, x.lng], { icon: destIcon }).addTo(map);
  $('pName').textContent = x.name; $('pAddr').textContent = x.addr || '';
  if (!S.me) { map.setView([x.lat, x.lng], 16); showPreview(null); toast('출발지를 모릅니다. 위치를 허용하거나 지도를 길게 눌러 출발지를 정하세요.', 4000); return; }
  requestRoute();
}

function decode6(str) {
  const pts = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (res & 1) ? ~(res >> 1) : (res >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    pts.push([lat / 1e6, lng / 1e6]);
  }
  return pts;
}

async function fetchRoute(from, to) {
  const body = {
    locations: [{ lat: from.lat, lon: from.lng, ...(from.heading != null && S.nav ? { heading: Math.round(from.heading), heading_tolerance: 60 } : {}) }, { lat: to.lat, lon: to.lng }],
    costing: S.mode, language: 'ko-KR', units: 'kilometers',
    ...(S.mode === 'pedestrian' ? { costing_options: { pedestrian: { sidewalk_factor: 0.8, walkway_factor: 0.9 } } } : {}),
  };
  const res = await fetch(ROUTER, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const d = await res.json();
  if (!d.trip) throw new Error(d.error || '경로 없음');
  const leg = d.trip.legs[0];
  const pts = decode6(leg.shape);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + map.distance(pts[i - 1], pts[i]));
  const route = { pts, dpts: pts, cum, total: cum[cum.length - 1], time: d.trip.summary.time, mans: leg.maneuvers };
  if (S.mode === 'pedestrian') {
    try { route.dpts = offsetLine(pts, await sideOffsets(leg.shape, pts.length)); } catch {}
  }
  return route;
}

// 걷기: 큰 도로는 중앙선 대신 오른쪽 보도 쪽에 선을 그림 (도로 등급별 대략적인 반폭, m)
const HALF_WIDTH = { motorway:15, trunk:14, primary:12, secondary:9, tertiary:6.5, unclassified:4, residential:3.5, service_other:0 };
async function sideOffsets(shape, n) {
  const res = await fetch(ROUTER.replace('/route', '/trace_attributes'), { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ encoded_polyline: shape, shape_match:'edge_walk', costing:'pedestrian',
      filters:{ attributes:['edge.road_class','edge.use','edge.lane_count','edge.begin_shape_index','edge.end_shape_index'], action:'include' } }) });
  const d = await res.json();
  const off = new Array(n - 1).fill(0);
  for (const e of d.edges || []) {
    const footway = /footway|sidewalk|pedestrian|path|steps|crossing|cycleway|track|living_street/.test(e.use || '');
    let w = footway ? 0 : (HALF_WIDTH[e.road_class] ?? 0);
    if (!footway && e.lane_count > 1) w = Math.max(w, e.lane_count * 3.2 + 1.5);
    for (let i = e.begin_shape_index; i < e.end_shape_index && i < n - 1; i++) off[i] = w;
  }
  return off;
}
// 선을 진행 방향 오른쪽으로 off[i] m만큼 평행 이동
function offsetLine(pts, off) {
  if (!off.some((v) => v > 0)) return pts;
  const lat0 = pts[0][0], kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
  const xy = pts.map(([la, lo]) => [(lo - pts[0][1]) * kx, (la - lat0) * ky]);
  const nrm = [];
  for (let i = 0; i < xy.length - 1; i++) {
    const dx = xy[i + 1][0] - xy[i][0], dy = xy[i + 1][1] - xy[i][1], L = Math.hypot(dx, dy);
    nrm.push(L < 0.01 ? (nrm[i - 1] || [0, 0]) : [dy / L, -dx / L]);   // 오른쪽 법선
  }
  const out = xy.map((p, j) => {
    const a = nrm[j - 1], b = nrm[j];
    let n, o;
    if (!a) { n = b; o = off[j]; } else if (!b) { n = a; o = off[j - 1]; }
    else {
      o = (off[j - 1] + off[j]) / 2;
      const sx = a[0] + b[0], sy = a[1] + b[1], sl = Math.hypot(sx, sy);
      if (sl < 0.3) n = b;                                                  // 거의 되돌아가는 꺾임
      else { const cos = sl / 2; n = [sx / sl / Math.max(cos, 0.5), sy / sl / Math.max(cos, 0.5)]; }
    }
    return [p[0] + n[0] * o, p[1] + n[1] * o];
  });
  return out.map(([x, y]) => [lat0 + y / ky, pts[0][1] + x / kx]);
}

async function requestRoute() {
  toast('경로를 찾는 중…', 8000);
  try {
    S.route = await fetchRoute(S.me, S.dest);
    drawRoute();
    toast(`${MODE[S.mode].label} 경로를 찾았습니다.`, 1500);
    if (!S.nav) {
      showPreview(S.route);
      map.fitBounds(L.latLngBounds(S.route.pts), { paddingTopLeft:[30, 150], paddingBottomRight:[70, 250], animate:false });
    }
  } catch (e) {
    toast('경로를 찾지 못했습니다. 잠시 뒤 다시 시도하거나 이동 수단을 바꿔 보세요. (' + e.message + ')', 5000);
  }
}

function drawRoute() {
  const pts = S.route.dpts;
  [routeCasing, routeLine].forEach((l) => l && map.removeLayer(l));
  routeCasing = L.polyline(pts, { color:'#ffffff', weight:11, opacity:.9, interactive:false }).addTo(map);
  routeLine = L.polyline(pts, { color:'#1f62b0', weight:7, opacity:.95, interactive:false,
    dashArray: S.mode === 'pedestrian' ? '1 12' : null, lineCap:'round' }).addTo(map);
  if (S.mode === 'pedestrian') routeLine.setStyle({ weight:8 });
  if (!doneLine) doneLine = L.polyline([], { color:'#9aa5b4', weight:8, opacity:.95, interactive:false, lineCap:'round', lineJoin:'round' }).addTo(map);
  doneLine.bringToFront();
  meMarker && meMarker.setZIndexOffset(1000);
}

function showPreview(r) {
  S.follow = false; $('locBtn').classList.remove('on'); setBearing(0);
  $('pTime').textContent = r ? fmtTime(r.time) : '-';
  $('pDist').textContent = r ? fmtDist(r.total) : '-';
  $('pEta').textContent = r ? fmtEta(r.time) : '-';
  $('startBtn').disabled = $('simBtn').disabled = !r;
  $('startBtn').style.opacity = $('simBtn').style.opacity = r ? 1 : .45;
  $('preview').hidden = false; $('results').hidden = true;
  layoutFloating();
}

function clearRoute() {
  [routeCasing, routeLine, doneLine, destMarker].forEach((l) => l && map.removeLayer(l));
  routeCasing = routeLine = doneLine = destMarker = null;
  S.route = null; S.dest = null;
  $('preview').hidden = true; layoutFloating();
  S.follow = true; $('locBtn').classList.add('on'); followView(true);
}

// ── 안내 ────────────────────────────────────────
function startNav(sim) {
  if (!S.route) return;
  if (doneLine) doneLine.setLatLngs([]);
  S.nav = true; S.follow = true; S.idx = 0; S.along = 0; S.offCount = 0; S.spoken.clear();
  $('top').hidden = true; $('preview').hidden = true; $('gpsNote').hidden = true;
  $('banner').hidden = false; $('navbar').hidden = false;
  const first = S.route.mans[0];
  sayNow(`안내를 시작합니다. ${first.verbal_pre_transition_instruction || first.instruction}`);
  startCompass();
  if (S.me.heading == null) S.me.heading = bearing(S.route.pts[0][0], S.route.pts[0][1], S.route.pts[Math.min(3, S.route.pts.length - 1)][0], S.route.pts[Math.min(3, S.route.pts.length - 1)][1]);
  map.stop();
  map.setZoom(S.mode === 'auto' ? 17 : 18, { animate:false });
  layoutFloating();
  keepAwake(true);
  goFullscreen();
  followView(true);
  if (sim) startSim(); else onNavTick();
}

function stopNav(msg) {
  S.nav = false; stopSim(); keepAwake(false);
  $('banner').hidden = true; $('navbar').hidden = true; $('offroute').hidden = true;
  $('top').hidden = false;
  if (msg) toast(msg, 3500);
  if (S.route) showPreview(S.route);
  updateGpsNote(); layoutFloating();
  setTimeout(() => map.invalidateSize(), 300);
}

// 경로 위 가장 가까운 점 찾기(앞쪽 위주로)
function project(lat, lng) {
  const { pts, cum } = S.route;
  const kx = Math.cos(lat * Math.PI / 180) * 111320, ky = 110540;
  let best = { d: Infinity, i: 0, t: 0 };
  const from = Math.max(0, S.idx - 10), to = Math.min(pts.length - 1, S.idx + 400);
  for (let i = from; i < to; i++) {
    const ax = (pts[i][1] - lng) * kx, ay = (pts[i][0] - lat) * ky;
    const bx = (pts[i + 1][1] - lng) * kx, by = (pts[i + 1][0] - lat) * ky;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    let t = L2 ? -(ax * dx + ay * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
    const px = ax + t * dx, py = ay + t * dy, d = Math.hypot(px, py);
    if (d < best.d) best = { d, i, t };
  }
  const along = cum[best.i] + (cum[best.i + 1] - cum[best.i]) * best.t;
  return { off: best.d, idx: best.i, t: best.t, along };
}

function onNavTick() {
  if (!S.nav || !S.route || !S.me || S.rerouting) return;
  const { lat, lng, acc } = S.me;
  const p = project(lat, lng);
  const R = S.route, M = MODE[S.mode];

  // 경로 이탈
  if (!S.sim && p.off > Math.max(M.offRoute, (acc || 0) * 1.2)) {
    S.offCount++;
    if (S.offCount >= 3 && Date.now() - S.lastReroute > 8000) return reroute();
  } else { S.offCount = 0; $('offroute').hidden = true; }

  S.idx = p.idx; S.along = Math.max(S.along, p.along - 5) ;
  const along = p.along;
  const trail = doneLine.getLatLngs();
  if (!trail.length || map.distance(trail[trail.length - 1], [lat, lng]) > 2) doneLine.addLatLng([lat, lng]);
  const dp = R.dpts, a = dp[p.idx], b = dp[p.idx + 1] || a;
  const here = [a[0] + (b[0] - a[0]) * p.t, a[1] + (b[1] - a[1]) * p.t];
  const rest = [here, ...dp.slice(p.idx + 1)];
  routeLine.setLatLngs(rest); routeCasing.setLatLngs(rest);

  // 도착
  const remain = Math.max(0, R.total - along);
  if (remain < 20 || map.distance([lat, lng], [S.dest.lat, S.dest.lng]) < 15) {
    say('목적지에 도착했습니다. 안내를 종료합니다.');
    return stopNav(`${S.dest.name}에 도착했습니다.`);
  }

  // 다음 회전 지점
  let k = R.mans.findIndex((m, j) => j > 0 && R.cum[m.begin_shape_index] > along + 3);
  if (k < 0) k = R.mans.length - 1;
  const man = R.mans[k], next = R.mans[k + 1];
  const toMan = Math.max(0, R.cum[man.begin_shape_index] - along);

  $('bIco').innerHTML = maneuverIcon(man.type);
  $('bDist').textContent = fmtDist(toMan);
  $('bText').textContent = man.instruction;
  $('bNext').textContent = next && man.type !== 4 && (R.cum[next.begin_shape_index] - R.cum[man.begin_shape_index]) < 150
    ? '이어서 ' + next.instruction : '';

  const remTime = R.time * remain / R.total;
  $('nTime').textContent = fmtTime(remTime);
  $('nDist').textContent = fmtDist(remain);
  $('nEta').textContent = fmtEta(remTime);

  // 음성 안내 (거리 단계별 한 번씩)
  const verbal = man.verbal_pre_transition_instruction || man.instruction;
  M.speak.forEach((th, n) => {
    const key = k + ':' + n;
    const last = n === M.speak.length - 1;
    if (toMan <= th && !S.spoken.has(key) && (last || toMan > M.speak[n + 1])) {
      S.spoken.add(key);
      for (let j = n + 1; j < M.speak.length; j++) if (toMan <= M.speak[j]) S.spoken.add(k + ':' + j);
      say(last ? verbal : `${speakDist(toMan)} 앞에서 ${verbal}`);
    }
  });

}

async function reroute() {
  S.rerouting = true; S.lastReroute = Date.now(); S.offCount = 0;
  $('offroute').hidden = false;
  say('경로를 벗어났습니다. 경로를 다시 찾습니다.');
  try {
    S.route = await fetchRoute(S.me, S.dest);
    drawRoute(); S.idx = 0; S.along = 0; S.spoken.clear();
    say('새 경로로 안내합니다.');
  } catch { toast('새 경로를 찾지 못했습니다. 잠시 뒤 다시 시도합니다.'); }
  $('offroute').hidden = true; S.rerouting = false;
  onNavTick();
}

// ── 모의 주행 (실제로 움직이지 않고 경로를 따라가 보기) ──
function startSim() {
  const R = S.route, speed = MODE[S.mode].sim; // m/s
  let d = 0, last = performance.now();
  S.sim = setInterval(() => {
    const now = performance.now(); d += speed * (now - last) / 1000; last = now;
    if (d >= R.total) d = R.total;
    let i = S.idx; while (i < R.cum.length - 2 && R.cum[i + 1] < d) i++;
    const seg = R.cum[i + 1] - R.cum[i] || 1, t = (d - R.cum[i]) / seg;
    const P = R.dpts;
    const lat = P[i][0] + (P[i + 1][0] - P[i][0]) * t;
    const lng = P[i][1] + (P[i + 1][1] - P[i][1]) * t;
    setMe(lat, lng, 5, bearing(R.pts[i][0], R.pts[i][1], R.pts[i + 1][0], R.pts[i + 1][1]));
  }, 400);
  toast(`모의 주행 · 초속 ${speed}m로 경로를 따라갑니다.`);
}
function stopSim() { if (S.sim) { clearInterval(S.sim); S.sim = null; } }

// ── 음성 ────────────────────────────────────────
let koVoice = null, voiceWarned = false;
const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function pickVoice() {
  const v = speechSynthesis.getVoices();
  koVoice = v.find((x) => /^ko/i.test(x.lang) && x.localService) || v.find((x) => /^ko/i.test(x.lang)) || null;
  return v.length;
}
if (TTS) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', pickVoice); }
const utts = [];   // 안드로이드 크롬은 참조가 없으면 말하다 끊기는 일이 있어 잡아 둠
let lastStartAt = 0;
function makeUtt(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = 1.0; u.volume = 1;
  u.onstart = () => { lastStartAt = Date.now(); };
  u.onend = () => { const i = utts.indexOf(u); if (i >= 0) utts.splice(i, 1); };
  u.onerror = (e) => {
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    const why = { 'not-allowed': '브라우저가 음성을 막았습니다. 화면을 한 번 누른 뒤 스피커 버튼을 다시 눌러 보세요.',
      'language-unavailable': '한국어 음성이 없습니다. 휴대폰 설정 > 텍스트 음성 변환(TTS)에서 한국어를 설치해 주세요.',
      'voice-unavailable': '선택된 음성을 쓸 수 없습니다. 휴대폰 TTS 설정을 확인해 주세요.',
      'synthesis-failed': '음성 엔진 오류입니다. 휴대폰 TTS 엔진(구글/삼성)을 확인해 주세요.',
      'audio-busy': '다른 앱이 소리를 쓰고 있습니다.' }[e.error] || '';
    toast(`음성 오류(${e.error}). ${why}`, 7000);
  };
  utts.push(u); if (utts.length > 8) utts.shift();
  return u;
}
// 짧은 '띵' 소리: 소리 출력 확인 + 아이폰 오디오 잠금 해제
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume?.();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.3);
  } catch {}
}
function voiceInfo() {
  if (!TTS) return '음성 기능 없음';
  const v = speechSynthesis.getVoices();
  return `음성 ${v.length}개 · 한국어: ${koVoice ? koVoice.name : '없음'}`;
}
function voiceProblem() {
  if (voiceWarned) return; voiceWarned = true;
  if (!TTS) return toast(/KAKAOTALK|NAVER|Instagram|FBAN/i.test(navigator.userAgent)
    ? '이 앱 안의 브라우저는 음성을 지원하지 않습니다. 크롬이나 사파리로 열어 주세요.'
    : '이 브라우저는 음성 안내를 지원하지 않습니다.', 5000);
  if (pickVoice() && !koVoice) toast('휴대폰에 한국어 음성이 없습니다. 설정 > 텍스트 음성 변환(TTS)에서 한국어를 설치해 주세요.', 6000);
}
// 버튼을 누른 그 순간에 바로 말하기 (휴대폰 브라우저는 첫 음성을 터치 안에서만 허용)
function sayNow(text) {
  if (!S.voice) return;
  if (!TTS) return voiceProblem();
  pickVoice(); if (!koVoice) voiceProblem();
  beep();
  try { speechSynthesis.resume(); } catch {}
  if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
  const asked = Date.now();
  speechSynthesis.speak(makeUtt(text));
  // 3초 안에 말을 시작하지 않으면 원인 안내
  setTimeout(() => {
    if (lastStartAt < asked) toast(`음성이 시작되지 않았습니다 (${voiceInfo()}). '띵' 소리도 안 들렸다면 미디어 볼륨·무음 모드(아이폰 옆 스위치)를 확인하고, 띵만 들렸다면 휴대폰 설정 > 텍스트 음성 변환에서 한국어 음성을 설치해 주세요.`, 9000);
  }, 3000);
  quietUntil = Date.now() + text.length * 110 + 500;
}
// 안내 중 말하기: 말하는 중이면 끊고 잠깐 뒤에 (끊자마자 말하면 안드로이드 크롬이 무시함)
let sayTimer = null, quietUntil = 0;
function say(text) {
  if (!S.voice || !TTS || !text) return;
  clearTimeout(sayTimer);
  const wait = quietUntil - Date.now();   // 시작 안내가 끝날 때까지 기다림
  if (wait > 0) { sayTimer = setTimeout(() => say(text), wait); return; }
  const busy = speechSynthesis.speaking || speechSynthesis.pending;
  if (busy) speechSynthesis.cancel();
  sayTimer = setTimeout(() => { try { speechSynthesis.resume(); } catch {} speechSynthesis.speak(makeUtt(text)); }, busy ? 250 : 0);
}
function paintVoice() { $('voiceBtn').innerHTML = S.voice ? VOICE_ON : VOICE_OFF; $('voiceBtn').classList.toggle('on', S.voice); $('voiceBtn').setAttribute('aria-pressed', S.voice); }
$('voiceBtn').onclick = () => {
  S.voice = !S.voice; paintVoice();
$('locBtn').classList.add('on');
  if (S.voice) { sayNow('음성 안내를 켰습니다.'); toast('음성 안내 켜짐', 1200); }
  else { toast('음성 안내 꺼짐', 1200); if (TTS) speechSynthesis.cancel(); }
  try { localStorage.setItem('nav.voice', S.voice ? '1' : '0'); } catch {}
};
try { S.voice = localStorage.getItem('nav.voice') !== '0'; } catch {}
paintVoice();
window.addEventListener('pagehide', () => { try { localStorage.setItem('nav.voice', S.voice ? '1' : '0'); } catch {} });

// ── 화면 꺼짐 방지 ──────────────────────────────
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) S.wake = await navigator.wakeLock.request('screen');
    else if (!on && S.wake) { await S.wake.release(); S.wake = null; }
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (S.nav && document.visibilityState === 'visible') keepAwake(true); });

// ── 버튼 ────────────────────────────────────────
document.querySelectorAll('.modes button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.modes button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  S.mode = b.dataset.mode;
  if (meMarker) { meMarker.setIcon(meIcon()); paintArrow(); }
  if (S.dest && S.me) requestRoute();
});
$('startBtn').onclick = () => {
  if (S.gps !== 'ok' && !S.manualStart) return toast('현재 위치를 아직 모릅니다.');
  if (S.gps !== 'ok') { toast('GPS가 없어 모의 주행으로 안내합니다.'); return startNav(true); }
  startNav(false);
};
$('simBtn').onclick = () => startNav(true);
$('cancelBtn').onclick = clearRoute;
$('stopBtn').onclick = () => { if (TTS) speechSynthesis.cancel(); stopNav('안내를 종료했습니다.'); exitFullscreen(); };
$('locBtn').onclick = () => {
  if (!S.me) return toast('현재 위치를 아직 모릅니다.');
  S.follow = true; $('locBtn').classList.add('on');
  startCompass();
  if (map.getZoom() < 16) map.setZoom(17, { animate:false });
  followView(true);
};
// 두 손가락(핀치) 확대는 따라가기를 끄지 않음, 한 손가락으로 밀 때만 멈춤
let fingers = 0, pinchAt = 0;
document.addEventListener('touchstart', (e) => { fingers = e.touches.length; if (fingers > 1) pinchAt = Date.now(); }, { passive:true, capture:true });
document.addEventListener('touchend', (e) => { fingers = e.touches.length; }, { passive:true, capture:true });
map.on('dragstart', () => {
  const was = S.follow;
  setTimeout(() => {
    if (fingers > 1 || Date.now() - pinchAt < 400) { if (was) S.follow = true; return; }
    S.follow = false; $('locBtn').classList.remove('on');
  }, 120);
});
map.on('zoomend', () => { if (S.follow) followView(true); });
$('layerBtn').onclick = () => { $('layerMenu').hidden = !$('layerMenu').hidden; };
document.querySelectorAll('#layerMenu button').forEach((b) => b.onclick = () => {
  map.removeLayer(curLayer); curLayer = layers[b.dataset.layer].addTo(map); curLayer.bringToBack?.();
  document.querySelectorAll('#layerMenu button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  $('layerMenu').hidden = true;
});
map.on('click', () => { $('layerMenu').hidden = true; $('results').hidden = true; });

// 떠 있는 버튼·알림을 시트 위로
function layoutFloating() {
  const sheet = !$('preview').hidden ? $('preview') : !$('navbar').hidden ? $('navbar') : null;
  const h = sheet ? sheet.offsetHeight : 0;
  $('fabs').style.bottom = `calc(${h + 16}px + ${sheet ? '0px' : 'var(--sb)'})`;
  toastEl.style.bottom = `calc(${h + 20}px + ${sheet ? '0px' : 'var(--sb)'})`;
  const n = $('gpsNote'); n.style.bottom = `calc(${h + 16}px + var(--sb))`;
}
window.addEventListener('resize', layoutFloating);
layoutFloating();

// ── 따라가기 + 진행 방향을 위로 ─────────────────
function setBearing(b) { S.viewBearing = b; if (map.setBearing) map.setBearing(b); paintArrow(); paintHead(); }
// 화면 위쪽이 가리키는 실제 방위 = -지도회전
function paintArrow() {
  const cone = document.getElementById('meCone');
  if (!cone || !S.me) return;
  cone.style.display = S.me.heading != null ? '' : 'none';
  if (S.me.heading != null) cone.style.transform = `rotate(${S.me.heading + S.viewBearing}deg)`;
}
function paintHead() {
  $('headIco').style.transform = `rotate(${S.viewBearing}deg)`;   // 빨간 바늘 = 북쪽
  $('headBtn').classList.toggle('on', S.headUp);
}
const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
function destPoint(lat, lng, brg, dist) {
  const R = 6371000, d = dist / R, t = brg * Math.PI / 180, p1 = lat * Math.PI / 180, l1 = lng * Math.PI / 180;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [p2 * 180 / Math.PI, l2 * 180 / Math.PI];
}
let lastFollow = 0;
function followView(force) {
  if (!S.me || !S.follow) return;
  const now = Date.now();
  if (!force && now - lastFollow < 250) return;   // 너무 잦은 갱신은 건너뜀
  lastFollow = now;
  const h = S.me.heading;
  const up = S.headUp && h != null;
  // 회전은 부드럽게 (작은 흔들림 무시)
  if (up) {
    const target = -h;
    const d = angDiff(S.viewBearing, target);
    if (force || Math.abs(d) > 4) setBearing((S.viewBearing + d * (force ? 1 : 0.6) + 360) % 360);
  } else if (S.viewBearing !== 0) setBearing(0);
  // 안내 중에는 내 위치를 화면 아래쪽(약 70%)에 두어 앞길이 더 보이게
  let c = [S.me.lat, S.me.lng];
  if (S.nav) {
    const mpp = 156543.034 * Math.cos(S.me.lat * Math.PI / 180) / Math.pow(2, map.getZoom());
    const up2 = -S.viewBearing;                       // 화면 위쪽 방위
    c = destPoint(S.me.lat, S.me.lng, up2, map.getSize().y * 0.2 * mpp);
  }
  map.panTo(c, { animate: !force, duration: .8, easeLinearity: 1, noMoveStart: true });
}
$('headBtn').onclick = () => {
  S.headUp = !S.headUp; startCompass();
  toast(S.headUp ? '진행 방향이 위로 오게 지도가 돌아갑니다.' : '북쪽이 위로 고정됩니다.', 1600);
  if (!S.headUp) setBearing(0);
  S.follow = true; $('locBtn').classList.add('on'); followView(true); paintHead();
};

// 나침반(휴대폰 방향 센서): 천천히 걸을 때 진행 방향으로 사용
let compassOn = false;
function onCompass(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;           // 아이폰
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;         // 안드로이드
  if (h == null) return;
  h = (h + (screen.orientation?.angle || 0)) % 360;
  S.compass = S.compass == null ? h : (S.compass + angDiff(S.compass, h) * 0.3 + 360) % 360;
  S.compassAt = Date.now();
  if (S.me && S.gpsCourse == null && !S.sim) { S.me.heading = S.compass; paintArrow(); followView(); }
}
function startCompass() {
  if (compassOn) return;
  const go = () => {
    compassOn = true;
    if ('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute', onCompass);
    else addEventListener('deviceorientation', onCompass);
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().then((r) => { if (r === 'granted') go(); }).catch(() => {});
  } else go();
}
startCompass();   // 안드로이드는 권한 없이 바로 시작, 아이폰은 버튼을 누를 때

// ── 전체 화면 ───────────────────────────────────
const standalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone;
const FS_ON = SVG('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>');
const FS_OFF = SVG('<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>');
const fsOK = !standalone && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function goFullscreen() {
  if (!fsOK || isFs()) return;
  const el = document.documentElement;
  try { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' }); p?.catch?.(() => {}); } catch {}
}
function exitFullscreen() { if (isFs()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document)?.catch?.(() => {}); } catch {} } }
function paintFs() { $('fsBtn').innerHTML = isFs() ? FS_OFF : FS_ON; $('fsBtn').classList.toggle('on', isFs()); }
if (fsOK) { $('fsBtn').hidden = false; paintFs(); }
$('fsBtn').onclick = () => { isFs() ? exitFullscreen() : goFullscreen(); };
['fullscreenchange', 'webkitfullscreenchange'].forEach((e) => document.addEventListener(e, () => { paintFs(); setTimeout(() => map.invalidateSize(), 200); }));
// 아이폰 사파리는 웹페이지 전체 화면을 지원하지 않음 → 홈 화면에 추가 안내(한 번만)
if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) {
  try { if (!localStorage.getItem('nav.iosTip')) { setTimeout(() => toast('공유 버튼 → "홈 화면에 추가"로 설치하면 주소창 없이 전체 화면으로 쓸 수 있습니다.', 6000), 2500); localStorage.setItem('nav.iosTip', '1'); } } catch {}
}

// 카카오톡 안에서 열리면 기본 브라우저로 다시 열기 (위치·음성·전체화면이 제한됨)
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
}

// 홈 화면 앱으로 설치 가능하게
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations?.().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});

function bearing(la1, lo1, la2, lo2) {
  const r = Math.PI / 180, y = Math.sin((lo2 - lo1) * r) * Math.cos(la2 * r);
  const x = Math.cos(la1 * r) * Math.sin(la2 * r) - Math.sin(la1 * r) * Math.cos(la2 * r) * Math.cos((lo2 - lo1) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
</script>
